version: 2

models:
  - name: int_payments_erp_terminal_match
    description: >
      Stub ERP ↔ payments terminal match grain. Unit tests override this
      ref; replace with real match logic in a production project.

  - name: payments_terminal_data
    description: >
      Stub current payments-provider terminal assignment. Unit tests
      override this ref with merchant/store pairs under test.

  - name: int_payments_terminal_reassign_audit
    description: >
      Actionable ERP ↔ payments target matches by terminal_id with
      feed_status and is_in_feed. Include when payments store_id is null
      or merchant_id is null/mismatched vs ERP target. Skip when merchant
      matches and a store is already assigned. Dedupes to one row per
      terminal (lowest store_id, then newest lot).
    columns:
      - name: terminal_id
        description: Payments terminal identifier (grain key after dedupe).
        data_tests:
          - not_null
      - name: feed_status
        description: Classification reason for include / exclude.
        data_tests:
          - accepted_values:
              values:
                - included_reassign
                - excluded_terminal_not_in_payments
                - excluded_dedupe
                - excluded_merchant_assigned
      - name: is_in_feed
        description: True when feed_status = included_reassign.
      - name: dedupe_rank
        description: 1 = winner per terminal_id; losers filtered out of audit.

unit_tests:
  - name: test_audit_include_when_payments_store_is_null
    description: Merchant match with no store in payments should be included for store assign.
    model: int_payments_terminal_reassign_audit
    given:
      - input: ref('int_payments_erp_terminal_match')
        rows:
          - {
              company_id: DemoCorp,
              merchant_id: merchant_demo_est_001,
              store_id: ST_DEMO_01,
              establishment_uid: est-uuid-001,
              terminal_id: TERM-DEMO-001,
              to_disable_standalone_tip: false,
              create_date: 2026-07-27,
              lot_create_timestamp: 2026-07-27T10:00:00,
              lot_id: 1
            }
      - input: ref('payments_terminal_data')
        rows:
          - {
              terminal_id: TERM-DEMO-001,
              merchant_id: merchant_demo_est_001,
              store_id: null
            }
    expect:
      format: dict
      rows:
        - {
            terminal_id: TERM-DEMO-001,
            erp_target_merchant_id: merchant_demo_est_001,
            payments_assigned_store_id: null,
            feed_status: included_reassign,
            is_in_feed: true,
            dedupe_rank: 1
          }

  - name: test_audit_include_when_payments_merchant_mismatch
    description: Wrong merchant in payments should be included (store mismatch is implicit).
    model: int_payments_terminal_reassign_audit
    given:
      - input: ref('int_payments_erp_terminal_match')
        rows:
          - {
              company_id: DemoCorp,
              merchant_id: merchant_demo_est_001,
              store_id: ST_DEMO_01,
              establishment_uid: est-uuid-001,
              terminal_id: TERM-DEMO-001,
              to_disable_standalone_tip: false,
              create_date: 2026-07-27,
              lot_create_timestamp: 2026-07-27T10:00:00,
              lot_id: 1
            }
      - input: ref('payments_terminal_data')
        rows:
          - {
              terminal_id: TERM-DEMO-001,
              merchant_id: merchant_wrong_other,
              store_id: ST_OLD
            }
    expect:
      rows:
        - {
            terminal_id: TERM-DEMO-001,
            payments_assigned_merchant_id: merchant_wrong_other,
            feed_status: included_reassign,
            is_in_feed: true
          }

  - name: test_audit_exclude_when_merchant_matches_and_store_assigned
    description: Merchant match with any store assigned is not stored in actionable audit.
    model: int_payments_terminal_reassign_audit
    given:
      - input: ref('int_payments_erp_terminal_match')
        rows:
          - {
              company_id: DemoCorp,
              merchant_id: merchant_demo_est_001,
              store_id: ST_DEMO_01,
              establishment_uid: est-uuid-001,
              terminal_id: TERM-DEMO-001,
              to_disable_standalone_tip: false,
              create_date: 2026-07-27,
              lot_create_timestamp: 2026-07-27T10:00:00,
              lot_id: 1
            }
      - input: ref('payments_terminal_data')
        rows:
          - {
              terminal_id: TERM-DEMO-001,
              merchant_id: merchant_demo_est_001,
              store_id: ST_OLD
            }
    expect:
      rows: []

  - name: test_audit_exclude_when_terminal_missing_in_payments
    description: Terminal not in payments_terminal_data should be excluded with reason.
    model: int_payments_terminal_reassign_audit
    given:
      - input: ref('int_payments_erp_terminal_match')
        rows:
          - {
              company_id: DemoCorp,
              merchant_id: merchant_demo_est_001,
              store_id: ST_DEMO_01,
              establishment_uid: est-uuid-001,
              terminal_id: TERM-DEMO-001,
              to_disable_standalone_tip: false,
              create_date: 2026-07-27,
              lot_create_timestamp: 2026-07-27T10:00:00,
              lot_id: 1
            }
      - input: ref('payments_terminal_data')
        rows: []
    expect:
      rows:
        - {
            terminal_id: TERM-DEMO-001,
            feed_status: excluded_terminal_not_in_payments,
            is_in_feed: false
          }

  - name: test_audit_omits_dedupe_loser_rows
    description: Only dedupe winner (lowest store_id) is stored in actionable audit.
    model: int_payments_terminal_reassign_audit
    given:
      - input: ref('int_payments_erp_terminal_match')
        rows:
          - {
              company_id: DemoCorp,
              merchant_id: merchant_demo_est_001,
              store_id: ST_AAA,
              establishment_uid: est-uuid-001,
              terminal_id: TERM-DEMO-001,
              to_disable_standalone_tip: false,
              create_date: 2026-07-27,
              lot_create_timestamp: 2026-07-27T10:00:00,
              lot_id: 1
            }
          - {
              company_id: DemoCorp,
              merchant_id: merchant_demo_est_001,
              store_id: ST_ZZZ,
              establishment_uid: est-uuid-001,
              terminal_id: TERM-DEMO-001,
              to_disable_standalone_tip: false,
              create_date: 2026-07-27,
              lot_create_timestamp: 2026-07-27T09:00:00,
              lot_id: 2
            }
      - input: ref('payments_terminal_data')
        rows:
          - {
              terminal_id: TERM-DEMO-001,
              merchant_id: merchant_demo_est_001,
              store_id: null
            }
    expect:
      rows:
        - {
            terminal_id: TERM-DEMO-001,
            erp_target_store_id: ST_AAA,
            dedupe_rank: 1,
            feed_status: included_reassign,
            is_in_feed: true
          }
