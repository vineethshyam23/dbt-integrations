version: 2

sources:
  - name: crm
    database: your-gcp-project
    schema: staging
    description: >
      Generic CRM landing tables (trusted staging). Loaded upstream by ingestion;
      dbt stages a thin typed view for tests and downstream refs.
    freshness:
      warn_after:
        count: 12
        period: hour
      error_after:
        count: 24
        period: hour
    loaded_at_field: _update_ts
    tables:
      - name: crm_account
        description: >
          Account master from the CRM. Grain is one row per account_id
          (current extract; history lives elsewhere).
        columns:
          - name: id
            description: Primary key from the CRM.
            tests:
              - not_null
              - unique
          - name: is_deleted
            description: Soft-delete flag from the source system.
          - name: name
            description: Account display name (company or person account).
          - name: record_type_id
            description: CRM record-type identifier.
          - name: country_code
            description: Billing / operating country code.
          - name: account_source
            description: Acquisition channel recorded on the account.
          - name: channel_code
            description: Commercial channel classification.
          - name: created_at
            description: Account create timestamp in the CRM.
          - name: system_modstamp
            description: Last system modification timestamp in the CRM.
          - name: is_test_data
            description: True when the row is a sandbox / test account.
          - name: _create_ts
            description: Warehouse load create timestamp.
          - name: _update_ts
            description: Warehouse load update timestamp (freshness column).
            tests:
              - not_null
